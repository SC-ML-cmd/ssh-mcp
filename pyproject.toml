[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-mcp"
version = "0.1.0"
description = "A minimal interactive SSH MCP server built on Paramiko."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
  "paramiko>=3.4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
ssh-mcp = "ssh_mcp.server:main"
ssh-mcp-viewer = "ssh_mcp.viewer:main"

[tool.setuptools.packages.find]
where = ["src"]
